<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREQ GUESS • 1/3 Octave</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            --bg: #0f0f12;
            --card: #1a1a21;
            --accent: #00ff9d;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: #ddd;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }
        header { text-align: center; margin-bottom: 20px; }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #00ff9d, #00cc7a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats {
            display: flex; justify-content: center; gap: 30px; margin: 15px 0; flex-wrap: wrap;
        }
        .stat { text-align: center; }
        .stat-label { font-size: 0.9rem; opacity: 0.7; }
        .stat-value { font-size: 1.8rem; font-weight: 600; color: var(--accent); }

        .main { flex: 1; max-width: 700px; margin: 0 auto; width: 100%; }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .tone-area { text-align: center; padding: 30px 0; }
        button.play {
            background: var(--accent); color: black; font-size: 1.3rem; font-weight: 600;
            padding: 16px 40px; border: none; border-radius: 50px; cursor: pointer;
            min-width: 200px;
        }
        button.play.stop { background: #ff4444; color: white; }

        .slider-container { margin: 30px 0; }
        label { display: block; margin-bottom: 8px; font-size: 1.1rem; }
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            height: 8px;
            border-radius: 9999px;
        }
        .freq-display {
            font-size: 2.8rem;
            font-weight: 600;
            text-align: center;
            margin: 12px 0;
            color: white;
        }

        .controls {
            display: flex; gap: 12px; flex-wrap: wrap;
        }
        button {
            flex: 1; padding: 14px; font-size: 1.1rem; border: none;
            border-radius: 12px; cursor: pointer; font-weight: 500;
        }
        button.submit { background: #00ff9d; color: black; }
        button.next { background: #333; }

        .result {
            margin-top: 20px; padding: 20px; border-radius: 12px;
            text-align: center; font-size: 1.3rem; min-height: 80px;
        }
        .correct { background: rgba(0, 255, 157, 0.2); color: #00ff9d; }
        .wrong { background: rgba(255, 80, 80, 0.2); color: #ff6666; }

        .history { margin-top: 20px; }
        .history h3 { margin-bottom: 12px; opacity: 0.8; }
        .history-list {
            max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
        }
        .history-item {
            background: #25252f; padding: 12px 16px; border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .volume {
            display: flex; align-items: center; gap: 12px; margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>FREQ GUESS</h1>
        <p>1/3 Octave Bands • Ear Training</p>
    </header>

    <div class="main">
        <div class="card">
            <div class="stats">
                <div class="stat"><div class="stat-label">CORRECT</div><div class="stat-value" id="correct">0</div></div>
                <div class="stat"><div class="stat-label">WRONG</div><div class="stat-value" id="wrong">0</div></div>
                <div class="stat"><div class="stat-label">ACCURACY</div><div class="stat-value" id="accuracy">—</div></div>
            </div>
        </div>

        <div class="card">
            <div class="tone-area">
                <button class="play" id="playBtn">▶ PLAY TONE (3s)</button>
            </div>

            <div class="slider-container">
                <label>Your Guess: <span id="guessValue">1000</span> Hz</label>
                <input type="range" id="guessSlider" min="0" value="12" style="width:100%;">
            </div>

            <div class="controls">
                <button class="submit" id="submitBtn">SUBMIT GUESS</button>
                <button id="nextBtn" style="display:none;">NEXT TONE</button>
            </div>

            <div class="result" id="result"></div>
        </div>

        <div class="card volume">
            <span>🔊 Volume</span>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.75" style="flex:1;">
        </div>

        <div class="card history">
            <h3>History</h3>
            <div class="history-list" id="history"></div>
        </div>
    </div>

    <script>
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let currentOsc = null;
        let currentGain = null;
        let currentFreq = 1000;
        let isPlaying = false;
        let timeoutId = null;
        let correctCount = 0;
        let wrongCount = 0;
        let history = [];

        const oneThirdOctave = [
            63, 80, 100, 125, 160, 200, 250, 315, 400, 500,
            630, 800, 1000, 1250, 1600, 2000, 2500, 3150,
            4000, 5000, 6300, 8000
        ];

        const playBtn = document.getElementById('playBtn');
        const guessSlider = document.getElementById('guessSlider');
        const guessValue = document.getElementById('guessValue');
        const submitBtn = document.getElementById('submitBtn');
        const nextBtn = document.getElementById('nextBtn');
        const resultDiv = document.getElementById('result');
        const volumeSlider = document.getElementById('volumeSlider');
        const historyDiv = document.getElementById('history');

        function updateStats() {
            document.getElementById('correct').textContent = correctCount;
            document.getElementById('wrong').textContent = wrongCount;
            const total = correctCount + wrongCount;
            const acc = total ? Math.round((correctCount / total) * 100) : 0;
            document.getElementById('accuracy').textContent = acc + '%';
        }

        function stopTone() {
            if (currentOsc) currentOsc.stop();
            if (timeoutId) clearTimeout(timeoutId);
            currentOsc = null;
            timeoutId = null;
            isPlaying = false;
            playBtn.textContent = '▶ PLAY TONE (3s)';
            playBtn.classList.remove('stop');
        }

        function playTone(autoStop = true) {
            stopTone();

            currentOsc = audioContext.createOscillator();
            currentGain = audioContext.createGain();

            currentOsc.type = 'sine';
            currentOsc.frequency.value = currentFreq;
            currentGain.gain.value = parseFloat(volumeSlider.value);

            currentOsc.connect(currentGain);
            currentGain.connect(audioContext.destination);
            currentOsc.start();

            isPlaying = true;
            playBtn.textContent = '■ STOP';
            playBtn.classList.add('stop');

            if (autoStop) {
                timeoutId = setTimeout(() => {
                    stopTone();
                }, 3000);
            }
        }

        function generateNewTone(autoPlay = true) {
            const index = Math.floor(Math.random() * oneThirdOctave.length);
            currentFreq = oneThirdOctave[index];

            resultDiv.innerHTML = '';
            nextBtn.style.display = 'none';
            submitBtn.disabled = false;

            // Reset slider to neutral middle position
            guessSlider.max = oneThirdOctave.length - 1;
            guessSlider.value = Math.floor(oneThirdOctave.length / 2);
            updateGuessDisplay();

            stopTone();

            if (autoPlay) {
                // Small delay so UI updates first
                setTimeout(() => playTone(), 50);
            }
        }

        function updateGuessDisplay() {
            const idx = parseInt(guessSlider.value);
            guessValue.textContent = oneThirdOctave[idx];
        }

        function addToHistory(actual, guessed, isCorrect) {
            history.unshift({ actual, guessed, correct: isCorrect });
            if (history.length > 12) history.pop();

            historyDiv.innerHTML = history.map(h => `
                <div class="history-item">
                    <span>${h.actual} Hz → <strong>${h.guessed} Hz</strong></span>
                    <span style="color:${h.correct ? '#00ff9d' : '#ff6666'}">
                        ${h.correct ? '✓ Exact' : '✗'}
                    </span>
                </div>
            `).join('');
        }

        // Event Listeners
        guessSlider.addEventListener('input', updateGuessDisplay);

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                stopTone();
            } else {
                playTone(false); // manual play does not auto-stop
            }
        });

        submitBtn.addEventListener('click', () => {
            const guessIndex = parseInt(guessSlider.value);
            const guessFreq = oneThirdOctave[guessIndex];
            const isCorrect = guessFreq === currentFreq;

            if (isCorrect) {
                correctCount++;
                resultDiv.className = 'result correct';
                resultDiv.innerHTML = `✅ Perfect Match!<br><strong>${currentFreq} Hz</strong>`;
            } else {
                wrongCount++;
                resultDiv.className = 'result wrong';
                resultDiv.innerHTML = `❌ Not quite.<br>Actual: <strong>${currentFreq} Hz</strong><br>You guessed ${guessFreq} Hz`;
            }

            addToHistory(currentFreq, guessFreq, isCorrect);
            updateStats();

            submitBtn.disabled = true;
            nextBtn.style.display = 'block';
            stopTone();
        });

        nextBtn.addEventListener('click', () => generateNewTone(true));

        volumeSlider.addEventListener('input', () => {
            if (currentGain) currentGain.gain.value = parseFloat(volumeSlider.value);
        });

        // Initialize
        updateStats();
        generateNewTone(true); // start with first auto-play

        // Keyboard support
        document.addEventListener('keydown', e => {
            if (e.key === ' ' && document.activeElement.tagName !== "INPUT") {
                e.preventDefault();
                if (isPlaying) stopTone();
                else playTone(false);
            }
            if (e.key === 'Enter' && !submitBtn.disabled) submitBtn.click();
        });
    </script>
</body>
</html>
